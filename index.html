<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Taxímetro Huaraz GPS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between p-4 selection:bg-amber-500 selection:text-slate-900">

  <!-- Encabezado / Modo GPS -->
  <header class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800 shadow-md">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <span class="font-bold text-amber-400 tracking-wide text-sm">TAXÍMETRO HUARAZ</span>
    </div>
    <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
      <span id="gps-icon" class="font-bold text-xs text-slate-300">📡</span>
      <span id="gps-status" class="text-xs font-semibold text-emerald-400">GPS Listo</span>
    </div>
  </header>

  <!-- Pantalla Principal de Cobro -->
  <main class="my-auto py-4">
    <div class="bg-slate-900 rounded-3xl p-6 border-2 border-amber-500/30 shadow-2xl text-center relative overflow-hidden">
      
      <!-- Badges de Estado -->
      <div class="flex justify-center gap-2 mb-4 flex-wrap">
        <span id="badge-tariff" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs px-3 py-1 rounded-full font-bold">
          ZONA URBANA CORE
        </span>
        <span id="badge-mode" class="bg-blue-500/10 text-blue-400 border border-blue-500/30 text-xs px-3 py-1 rounded-full font-bold">
          BANDERAZO
        </span>
      </div>

      <!-- Tarifa Acumulada -->
      <div class="text-slate-400 text-xs uppercase tracking-widest font-bold mb-1">Monto a Cobrar</div>
      <div class="text-6xl font-black tracking-tight text-white my-2 flex justify-center items-baseline gap-1">
        <span class="text-2xl text-amber-400 font-bold">S/</span>
        <span id="display-fare" class="font-mono text-emerald-400">4.00</span>
      </div>

      <!-- Métricas en Tiempo Real -->
      <div class="grid grid-cols-3 gap-2 mt-6 pt-4 border-t border-slate-800">
        <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
          <div class="text-[10px] text-slate-400 uppercase font-semibold">Distancia</div>
          <div class="text-base font-bold text-slate-100 font-mono" id="val-dist">0.00 km</div>
        </div>
        <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
          <div class="text-[10px] text-slate-400 uppercase font-semibold">Tiempo</div>
          <div class="text-base font-bold text-slate-100 font-mono" id="val-time">00:00</div>
        </div>
        <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
          <div class="text-[10px] text-slate-400 uppercase font-semibold">Velocidad</div>
          <div class="text-base font-bold text-slate-100 font-mono" id="val-speed">0 km/h</div>
        </div>
      </div>
    </div>

    <!-- Botones Rápidos de Destino para Huaraz -->
    <div class="mt-4">
      <div class="text-xs text-slate-400 mb-2 font-semibold flex justify-between">
        <span>Destinos Frecuentes</span>
        <span class="text-amber-400">Ajusta Tarifa Automático</span>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="setPreset('urbana')" class="bg-slate-900 hover:bg-slate-800 p-2 rounded-xl text-center border border-slate-800 text-xs font-semibold text-slate-300">
          🏛️ Centro Huaraz
        </button>
        <button onclick="setPreset('urbana')" class="bg-slate-900 hover:bg-slate-800 p-2 rounded-xl text-center border border-slate-800 text-xs font-semibold text-slate-300">
          🏥 EsSalud Vichay
        </button>
        <button onclick="setPreset('periurbana')" class="bg-slate-900 hover:bg-slate-800 p-2 rounded-xl text-center border border-amber-500/40 text-xs font-semibold text-amber-300">
          ♨️ Monterrey
        </button>
      </div>
    </div>
  </main>

  <!-- Botones de Acción -->
  <footer class="space-y-2">
    <div class="grid grid-cols-2 gap-2">
      <button id="btn-start" onclick="toggleTrip()" class="bg-emerald-600 active:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-base">
        ▶️ INICIAR CARRERA
      </button>
      <button id="btn-finish" onclick="finishTrip()" disabled class="bg-slate-800 text-slate-500 font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-base">
        🏁 FINALIZAR
      </button>
    </div>
  </footer>

  <!-- Modal de Recibo -->
  <div id="modal-receipt" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm text-center">
      <h3 class="text-lg font-bold text-amber-400 mb-1">Boleta Digital de Pago</h3>
      <p class="text-xs text-slate-400 mb-4">Servicio de Taxi Huaraz</p>
      
      <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-left space-y-2 mb-4 font-mono text-xs">
        <div class="flex justify-between"><span>Distancia:</span><span id="rec-dist">0.0 km</span></div>
        <div class="flex justify-between"><span>Tiempo en Ruta:</span><span id="rec-time">0 min</span></div>
        <div class="flex justify-between border-t border-slate-800 pt-2 font-bold text-sm text-white">
          <span>TOTAL A PAGAR:</span><span class="text-emerald-400" id="rec-total">S/ 0.00</span>
        </div>
      </div>

      <button onclick="copyWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl mb-2 text-sm flex items-center justify-center gap-2">
        📱 Copiar para WhatsApp
      </button>
      <button onclick="closeReceipt()" class="w-full bg-slate-800 text-slate-300 font-semibold py-2.5 rounded-xl text-sm">
        Cerrar
      </button>
    </div>
  </div>

  <script>
    let tariffs = {
      urbana: { banderazo: 4.00, km: 1.40, min: 0.20, minFare: 5.00, freeKm: 1.0 },
      periurbana: { banderazo: 6.00, km: 2.00, min: 0.30, minFare: 10.00, freeKm: 1.0 }
    };

    let currentMode = 'urbana';
    let isRunning = false;
    let isPaused = false;
    let startTime = null;
    let timerInterval = null;
    let totalDist = 0;
    let totalWaitSec = 0;
    let lastPos = null;
    let watchId = null;

    function setPreset(type) {
      currentMode = type;
      document.getElementById('badge-tariff').innerText = type === 'urbana' ? 'ZONA URBANA CORE' : 'ZONA PERIURBANA / MONTERREY';
      updateDisplay();
    }

    function toggleTrip() {
      if (!isRunning) {
        startTrip();
      } else if (!isPaused) {
        pauseTrip();
      } else {
        resumeTrip();
      }
    }

    function startTrip() {
      isRunning = true;
      isPaused = false;
      startTime = new Date();
      totalDist = 0;
      totalWaitSec = 0;
      lastPos = null;

      // Reseteo inmediato de la interfaz
      document.getElementById('display-fare').innerText = tariffs[currentMode].banderazo.toFixed(2);
      document.getElementById('val-dist').innerText = '0.00 km';
      document.getElementById('val-time').innerText = '00:00';
      document.getElementById('val-speed').innerText = '0 km/h';
      document.getElementById('badge-mode').innerText = 'EN MARCHA';

      let btnStart = document.getElementById('btn-start');
      btnStart.innerText = '⏸️ PAUSAR';
      btnStart.className = 'bg-amber-600 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-base';
      
      let btnFinish = document.getElementById('btn-finish');
      btnFinish.disabled = false;
      btnFinish.className = 'bg-red-600 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-base';

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);

      if ("geolocation" in navigator) {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(handleGPS, handleGPSError, {
          enableHighAccuracy: true,
          maximumAge: 1000
        });
      }
      requestWakeLock();
    }

    function pauseTrip() {
      isPaused = true;
      let btnStart = document.getElementById('btn-start');
      btnStart.innerText = '▶️ REANUDAR';
      btnStart.className = 'bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-base';
      document.getElementById('badge-mode').innerText = 'PAUSADO';
    }

    function resumeTrip() {
      isPaused = false;
      let btnStart = document.getElementById('btn-start');
      btnStart.innerText = '⏸️ PAUSAR';
      btnStart.className = 'bg-amber-600 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-base';
      document.getElementById('badge-mode').innerText = 'EN MARCHA';
    }

    function handleGPS(pos) {
      if (!isRunning || isPaused) return;
      document.getElementById('gps-status').innerText = 'GPS Activo';
      let speed = pos.coords.speed ? (pos.coords.speed * 3.6) : 0;
      document.getElementById('val-speed').innerText = Math.round(speed) + ' km/h';

      if (lastPos) {
        let d = getDistance(lastPos.latitude, lastPos.longitude, pos.coords.latitude, pos.coords.longitude);
        if (d > 0.003) { // Filtrar saltos menores a 3 metros
          totalDist += d;
        }
      }
      lastPos = pos.coords;

      if (speed < 12) {
        totalWaitSec++;
        document.getElementById('badge-mode').innerText = 'TRÁFICO / TIEMPO';
      } else {
        document.getElementById('badge-mode').innerText = 'EN MARCHA';
      }

      updateDisplay();
    }

    function handleGPSError() {
      document.getElementById('gps-status').innerText = 'GPS Esperando...';
    }

    function updateTimer() {
      if (!isRunning || isPaused) return;
      let elapsedSec = Math.floor((new Date() - startTime) / 1000);
      let m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
      let s = String(elapsedSec % 60).padStart(2, '0');
      document.getElementById('val-time').innerText = `${m}:${s}`;
      updateDisplay();
    }

    function updateDisplay() {
      let t = tariffs[currentMode];
      let billableKm = Math.max(0, totalDist - t.freeKm);
      let waitMin = totalWaitSec / 60;
      let calculatedFare = t.banderazo + (billableKm * t.km) + (waitMin * t.min);
      let finalFare = Math.max(t.minFare, calculatedFare);

      document.getElementById('display-fare').innerText = finalFare.toFixed(2);
      document.getElementById('val-dist').innerText = totalDist.toFixed(2) + ' km';
    }

    function finishTrip() {
      isRunning = false;
      isPaused = false;
      clearInterval(timerInterval);
      if (watchId) navigator.geolocation.clearWatch(watchId);

      document.getElementById('rec-dist').innerText = totalDist.toFixed(2) + ' km';
      document.getElementById('rec-time').innerText = document.getElementById('val-time').innerText;
      document.getElementById('rec-total').innerText = 'S/ ' + document.getElementById('display-fare').innerText;

      document.getElementById('modal-receipt').classList.remove('hidden');

      let btnStart = document.getElementById('btn-start');
      btnStart.innerText = '▶️ INICIAR CARRERA';
      btnStart.className = 'bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-base';
      
      let btnFinish = document.getElementById('btn-finish');
      btnFinish.disabled = true;
      btnFinish.className = 'bg-slate-800 text-slate-500 font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-base';
    }

    function closeReceipt() {
      document.getElementById('modal-receipt').classList.add('hidden');
    }

    function copyWhatsApp() {
      let text = `🚕 *RECIBO TAXI HUARAZ*\nDistancia: ${totalDist.toFixed(2)} km\nTiempo: ${document.getElementById('val-time').innerText}\n*Total a pagar: S/ ${document.getElementById('display-fare').innerText}*`;
      navigator.clipboard.writeText(text);
      alert('¡Recibo copiado! Pégalo en tu WhatsApp.');
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      let R = 6371;
      let dLat = (lat2 - lat1) * Math.PI / 180;
      let dLon = (lon2 - lon1) * Math.PI / 180;
      let a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    async function requestWakeLock() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
    }
  </script>
</body>
</html>
